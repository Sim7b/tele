---
name: Publish release

# Publishes the GitHub release of a version semantic-release tagged but did not publish (the Release workflow
# stopped after pushing the tag): the signed APK and the plugin zip built again from the tag, with the notes of
# its CHANGELOG section.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z), already pushed by the Release workflow
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # creates the GitHub release and uploads its files
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag: $TAG"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Install Java
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # Same signing key as the Release workflow (repository secrets)
      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the APK and the plugin zip
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/build-release-apk.sh "${TAG#v}" && dispatcharr-plugin/scripts/build_zip.sh && dispatcharr-plugin/scripts/build_repo_manifest.py "$TAG"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          # The section of this version in the changelog, as semantic-release writes it in the release notes
          awk -v head="## [$version]" 'index($0, head) == 1 {on = 1} on && /^## \[/ && index($0, head) != 1 {exit} on' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::No section for $version in CHANGELOG.md"
            exit 1
          fi
          plugin_zip=$(ls dispatcharr-plugin/dist/*.zip)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/tele-$TAG.apk" "$plugin_zip#Dispatcharr plugin (Télé API)" \
            "dispatcharr-plugin/dist/manifest.json#Dispatcharr plugin repository" \
            "dispatcharr-plugin/dist/tele_api.json#Dispatcharr plugin manifest"
