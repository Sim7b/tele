---
name: Screenshots

# The screenshots of the README, drawn on the JVM (Robolectric) with demo data, then proposed in a pull request
# when they changed.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  screenshots:
    name: Draw the README screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # pushes the automation branch
      pull-requests: write # opens its pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Draw the screenshots
        run: ./gradlew testDebugUnitTest --tests '*ReadmeScreenshots*' -Ptele.screenshots=docs/screenshots

      - name: Propose the screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          scripts/propose-changes.sh "screenshots" "docs: update the README screenshots" docs/screenshots
