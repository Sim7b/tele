# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # v10 needs conventional-changelog-writer 9, newer than the one bundled with semantic-release 25.
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: [">=10"]
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
