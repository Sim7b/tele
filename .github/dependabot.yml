# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
